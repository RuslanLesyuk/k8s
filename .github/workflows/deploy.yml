name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 🔥 ОБОВ’ЯЗКОВО — забирає код з репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔎 перевіримо що файли реально є
      - name: List files
        run: ls -R

      # 🔐 логін в GitHub Container Registry
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 🐳 Build образу
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/my-nginx:latest .

      # 📦 Push образу
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/my-nginx:latest

      # ☸️ Deploy в Kubernetes
      - name: Deploy to cluster
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
